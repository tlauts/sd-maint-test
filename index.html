<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        .divider {
            width: 50%;
            margin: 20px auto;
        }
        .butterflies {
            width: 300px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Basic Test Page</h1>
    <p>This is a simple test page with some decorative graphics pulled from the web to make it look nicer.</p>
    
    <img src="https://img.freepik.com/free-psd/decorative-line-divider-design_23-2151358255.jpg?semt=ais_hybrid&w=740&q=80" alt="Decorative Line Divider" class="divider">
    
    <p>Here's some sample content separated by dividers.</p>
    
    <img src="https://thumbs.dreamstime.com/b/divider-line-border-set-art-deco-vector-page-text-graphic-decorative-element-design-book-break-wedding-invitation-card-172584036.jpg" alt="Set of Divider Lines" class="divider">
    
    <p>And a fun decorative element with butterflies.</p>
    
    <img src="https://thumbs.dreamstime.com/b/decorative-butterfly-border-artwork-natural-motif-decorative-butterfly-frame-design-featuring-soft-curves-winged-395957083.jpg" alt="Decorative Butterflies" class="butterflies">
</body>
</html>
